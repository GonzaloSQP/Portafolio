name: CI & Static Deploy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificación Integral (Validación de Datos, Tipos, Tests y Build)
        run: npm run verify

      - name: Subir Artefacto Estático
        uses: actions/upload-artifact@v4
        with:
          name: static-dist
          path: dist/
          retention-days: 7


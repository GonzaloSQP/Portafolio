server {
    listen 80;
    listen [::]:80;
    server_name dev.apiscusco.com;

    # Redirección obligatoria a HTTPS en producción
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.apiscusco.com;

    # Certificados SSL (ej. Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/dev.apiscusco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.apiscusco.com/privkey.pem;

    # Ruta a los archivos estáticos compilados (salida de npm run build)
    root /var/www/dev.apiscusco.com/dist;
    index index.html;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Caché inmutable para assets versionados de Astro
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manejo de rutas limpias y página 404 real
    location / {
        try_files $uri $uri/ $uri.html /404.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

